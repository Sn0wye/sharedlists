[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "time", "migrate", "derive", "macros"] }
time = { version = "0.3.55", features = ["serde", "formatting"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time", "io-util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
